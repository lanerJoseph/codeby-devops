---
- name: Install Apache Ubuntu
  apt:
    name:
      - apache2
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install Apache CentOS
  yum:
    name:
      - httpd
    state: present
  when: ansible_os_family == "RedHat"

- name: Start Apache Ubuntu
  service:
    name: apache2
    state: started
    enabled: yes
  when: ansible_os_family == "Debian"

- name: Start Apache CentOS
  service:
    name: httpd
    state: started
    enabled: yes
  when: ansible_os_family == "RedHat"
# tasks file for roles/apache
