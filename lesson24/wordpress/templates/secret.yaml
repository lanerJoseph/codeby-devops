apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordpress.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.mysqlAuth.rootPassword | quote }}
  MYSQL_DATABASE: {{ .Values.mysqlAuth.database | quote }}
  MYSQL_USER: {{ .Values.mysqlAuth.username | quote }}
  MYSQL_PASSWORD: {{ .Values.mysqlAuth.password | quote }}
  WORDPRESS_DB_USER: {{ .Values.mysqlAuth.username | quote }}
  WORDPRESS_DB_PASSWORD: {{ .Values.mysqlAuth.password | quote }}
