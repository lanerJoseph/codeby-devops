  accessModes:
    - {{ .Values.wordpress.persistence.accessMode }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.wordpress.persistence.storageClass }}
  local:
    path: {{ .Values.wordpress.persistence.hostPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .Values.wordpress.persistence.nodeName }}
---
{{- end }}
