{{- if .Values.mysql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "wordpress.mysql.fullname" . }}-pv
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.mysql.persistence.size }}
  accessModes:
    - {{ .Values.mysql.persistence.accessMode }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.mysql.persistence.storageClass }}
  local:
    path: {{ .Values.mysql.persistence.hostPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .Values.mysql.persistence.nodeName }}
---
{{- end }}

{{- if .Values.wordpress.persistence.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "wordpress.wordpress.fullname" . }}-pv
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
