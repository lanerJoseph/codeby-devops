apiVersion: v1
kind: Service
metadata:
  name: {{ default (include "wordpress.wordpress.fullname" .) .Values.wordpress.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
  type: {{ .Values.wordpress.service.type }}
  ports:
    - name: http
      port: {{ .Values.wordpress.service.port }}
      targetPort: {{ .Values.wordpress.service.targetPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "wordpress.wordpress.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
